  <path d="M32 58 C32 50 31.5 44 32 36" fill="none" stroke="#8cc27a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M31.6 47.5 C26 47.5 20.5 44.5 18 39 C24.5 38.5 29.8 41.5 31.6 47.5 Z" fill="#8cc27a"/>
